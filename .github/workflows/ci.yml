name: CI

# docs/09-cicd.md §2.1, §2.2.
#
# Vercel deploys on its own. This pipeline exists for a different reason: to
# stop quality eroding after launch. Everything it checks is easy to satisfy
# once and easy to break later, and none of it fails loudly on its own.

on:
  pull_request:
  push:
    branches: [main, dev]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# lib/seo/origin.ts validates this at module load and throws without it, and
# next.config.ts imports it, so anything that evaluates the config needs it —
# `next typegen` in validate as well as `next build`. A placeholder is correct
# here: CI checks that the code compiles, not which host it will be served
# from. The real origin lives in Vercel's environment variables.
env:
  NEXT_PUBLIC_SITE_URL: https://example.com

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the PR's commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Warnings fail too. A warning nobody fixes trains everyone to ignore the
      # output, and then a real error hides in it (docs/07-repo-standards.md §4).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx --no -- commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A dropped locale does not fail `next build`. It succeeds, pages vanish,
      # and nothing reports it. This is the check that notices.
      - name: Assert every route prerendered
        run: npm run assert:routes

      # A cross-locale body link works when clicked, so review never catches
      # it. This reads the same HTML that ships (T-218, docs/05 §4.2).
      - name: Verify the internal link graph
        run: npm run verify:links

  # docs/09-cicd.md §2.6 — promoted to blocking in T-220 (§6, Sprint 2).
  #
  # Everything this job checks is invisible in a browser, absent from the build
  # output, and expensive to discover from Search Console six weeks later. The
  # reciprocity check is the reason it exists: a one-directional hreflang set
  # renders perfectly and cannot be seen by eye.
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    env:
      # Build the artifact that eventually ships at the canonical domain.
      # VERCEL_ENV alone no longer controls indexing — T-321 split the two
      # questions — so indexing is opted into explicitly here. Without it the
      # job would be checking a noindexed page, which is not what the canonical
      # host serves.
      VERCEL_ENV: production
      SITE_INDEXABLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start -- --port 3000 &
          until curl -sf -o /dev/null http://localhost:3000/en; do sleep 1; done

      # The fetch base and the expected origin are deliberately different: the
      # server listens on localhost while the canonicals must name the public
      # origin. Comparing a canonical against the host it was fetched from
      # would pass in every environment and prove nothing.
      - name: Verify metadata
        run: npm run verify:metadata -- http://localhost:3000 "$NEXT_PUBLIC_SITE_URL"

  # docs/09-cicd.md §2.5 — zero violations on all 12 routes (SRS A-01).
  axe:
    name: axe
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: production
      SITE_INDEXABLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start -- --port 3000 &
          until curl -sf -o /dev/null http://localhost:3000/en; do sleep 1; done

      # Both themes. T-219 found two contrast failures that existed only in
      # dark mode, on every button on the site; a light-only run was green.
      - name: Run axe
        run: npm run verify:axe -- http://localhost:3000
